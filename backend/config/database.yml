default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  url: <%= ENV["DATABASE_URL"] || "postgres://archive:archive@localhost:5432/archive_vault" %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
