name: archive-vault

x-backend: &backend
  build:
    context: ./backend
  environment:
    RAILS_ENV: production
    DATABASE_URL: postgres://archive:archive@timescale:5432/archive_vault
    REDIS_URL: redis://redis:6379/0
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY_ID: archive-minio
    MINIO_SECRET_ACCESS_KEY: archive-minio-secret
    MINIO_BUCKET: archive-reports
    MINIO_FORCE_PATH_STYLE: "true"
    # 浏览器下载报表时使用的 MinIO 外部地址
    MINIO_PUBLIC_ENDPOINT: http://localhost:9000
    # 生产部署请覆盖此值
    SECRET_KEY_BASE: a2f5e8c1b9d44736a0e7f1c2d8b5e9f0a1b2c3d4e5f60718293a4b5c6d7e8f90
    WEB_CONCURRENCY: "2"
    # 风险扫描周期（秒）。种子库以外的生产部署按采集周期调整
    RISK_SWEEP_INTERVAL: "300"
    RAILS_LOG_TO_STDOUT: "1"
    # 首次启动自动灌入演示数据（幂等）；正式部署改为 false
    SEED_ON_BOOT: "true"

services:
  timescale:
    image: timescale/timescaledb:2.15.3-pg16
    container_name: av-timescale
    environment:
      POSTGRES_USER: archive
      POSTGRES_PASSWORD: archive
      POSTGRES_DB: archive_vault
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive -d archive_vault"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: av-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: av-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: archive-minio
      MINIO_ROOT_PASSWORD: archive-minio-secret
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 archive-minio archive-minio-secret &&
      mc mb --ignore-existing local/archive-reports
      "

  # 迁移+种子由独立的一次性服务完成，web/worker 等它成功后再启动，
  # 避免两个进程并行迁移产生竞争
  migrate:
    <<: *backend
    container_name: av-migrate
    command: ./bin/migrate
    depends_on:
      timescale:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *backend
    container_name: av-web
    command: ./bin/start-web
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  worker:
    <<: *backend
    container_name: av-worker
    command: ./bin/start-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE: /api
    container_name: av-frontend
    depends_on:
      - web
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
  miniodata:
